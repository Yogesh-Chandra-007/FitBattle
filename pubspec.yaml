name: fitness_battle
description: Real-time 1v1 fitness battle app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_database: ^11.0.0

  # Camera & Pose Detection
  camera: ^0.11.0
  google_mlkit_pose_detection: ^0.12.0

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  lottie: ^3.1.0

  # State management
  provider: ^6.1.2

  # Utilities
  uuid: ^4.3.3
  wakelock_plus: ^1.2.1
  shared_preferences: ^2.3.0
  flutter_animate: ^4.5.0
  animate_do: ^3.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
